name: Release

# Push a tag like v0.1.0 (or v0.1.0-rc.1 for a trial run, which is published as a pre-release)
# to build tilog for Linux and macOS and attach the archives to a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds are static (musl), so they run on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          # Built on an Apple silicon runner, so it is not run here.
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
    steps:
      - uses: actions/checkout@v4

      - name: The tag must belong to the version in Cargo.toml
        shell: bash
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The tests run on the target that is shipped, not only on the glibc one of CI.
      - name: Test
        if: matrix.smoke
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Try the program
        if: matrix.smoke
        run: |
          bin=target/${{ matrix.target }}/release/tilog
          "$bin" --version
          "$bin" --print-man | head -n 1

      - name: Package
        run: scripts/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: tilog-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for all archives
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS && rm *.sha256 && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "tilog ${GITHUB_REF_NAME#v}" --generate-notes $flags
