[package]
name = "tilog"
version = "0.1.0"
edition = "2024"
description = "tig for logs: a small, fast, read-only TUI for live deployment logs and production error checks"
readme = "README.md"
rust-version = "1.88" # let chains
license = "MIT"
repository = "https://github.com/maxwellscode/tilog"
homepage = "https://maxwellscode.github.io/tilog/"
keywords = ["logs", "tui", "tail", "monitoring"]
categories = ["command-line-utilities"]
# The example logs are large and only the tests read them: they are not part of the package.
exclude = ["/examples", "/docs", "/.github", "/.devcontainer"]

[dependencies]
anyhow = "1.0.104"
# `use-dev-tty`: read keys from /dev/tty, so tilog still works with its stdin piped.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
libc = "0.2.190"
notify = "8.2.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# A small, fast binary for release builds: link-time optimization, one codegen unit, no symbols.
[profile.release]
lto = true
codegen-units = 1
strip = true
