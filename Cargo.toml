[package]
name = "tilog"
version = "0.1.0"
edition = "2024"
description = "A tiling TUI for real-time log monitoring, with per-tile filters"
readme = "README.md"
license = "MIT"
keywords = ["logs", "tui", "tail", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.190"
notify = "8.2.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
