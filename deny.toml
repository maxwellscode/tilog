# cargo-deny: run in CI (and with `cargo deny check` locally).

[graph]
all-features = true

# Known vulnerabilities and unmaintained crates, from the RustSec advisory database.
[advisories]
version = 2
yanked = "deny"

# Only licenses that are fine in an MIT project, for everything that ends up in the binary.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Crates come from crates.io only: no git dependencies or other registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
